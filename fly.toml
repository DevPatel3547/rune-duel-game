# Rune Duel match server on Fly.io. Deploy with: npm run deploy:server
#
# ONE MACHINE ONLY. Matches, rooms and the quick match queue live in this
# process's memory, so two machines would split players into two worlds that
# cannot see each other. The deploy script passes --ha=false for that reason;
# scale vertically (vm size) before ever scaling out.

app = "rune-duel-server"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "5s"

[build]
  dockerfile = "server/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  # Browser origins allowed to connect. Native app requests carry no Origin
  # header and are always allowed.
  ALLOWED_ORIGINS = "https://rune-duel.vercel.app,capacitor://localhost,https://localhost,http://localhost"

[http_service]
  internal_port = 3001
  force_https = true
  # Never sleep: a sleeping machine drops every match in progress and makes
  # the next player wait for a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 1500
    hard_limit = 2000

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
